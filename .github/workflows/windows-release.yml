name: Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application code
        run: npm run build-code

      - name: Build Windows artifacts
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          name="Kova ${version}"
          {
            echo "tag=$tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows releases now use the NSIS installer to support automatic updates.

            If Kova was installed from an MSI package, uninstall that version before running the new setup executable. Application data is retained.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
